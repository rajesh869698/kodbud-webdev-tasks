<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="header">
    <div class="header-left">
      <a href="#">About</a>
      <a href="#">Store</a>
    </div>
    <div class="header-right">
      <a href="#">Gmail</a>
      <a href="#">Images</a>
      <!-- 9-dot App Launcher Icon -->
      <a href="#" class="icon-btn" aria-label="Google apps">
        <svg class="app-icon" focusable="false" viewBox="0 0 24 24" width="24" height="24">
          <path d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z" fill="#5f6368"></path>
        </svg>
      </a>
      <!-- Sign In Button -->
      <button class="signin-btn">Sign in</button>
    </div>
  </header>

  <!-- Central Search Area -->
  <main class="main-content">
    <div class="logo-container">
      <img
        src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
        alt="Google"
        class="google-logo"
      />
    </div>

    <!-- Search Bar with Pill & Action Buttons inside -->
    <div class="search-bar">
      <!-- Left Plus Icon -->
      <button class="left-icon-btn" aria-label="Add shortcut">
        <svg focusable="false" viewBox="0 0 24 24" width="20" height="20">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="#70757a"></path>
        </svg>
      </button>

      <input type="text" autofocus />

      <!-- Right Action Tools -->
      <div class="right-tools">
        <!-- Mic -->
        <span class="tool-icon" title="Search by voice">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285f4" d="m12 15c1.66 0 3-1.34 3-3v-6c0-1.66-1.34-3-3-3s-3 1.34-3 3v6c0 1.66 1.34 3 3 3z"></path>
            <path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path>
            <path fill="#fbbc05" d="m7.05 16.87-1.41 1.41c1.62 1.62 3.82 2.62 6.36 2.62v-2c-1.99 0-3.79-.81-5.11-2.13z"></path>
            <path fill="#ea4335" d="m12 18.9c2.54 0 4.74-1 6.36-2.62l-1.41-1.41c-1.32 1.32-3.12 2.13-5.11 2.13z"></path>
          </svg>
        </span>
        <!-- Lens -->
        <span class="tool-icon" title="Search by image">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285f4" d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
            <path fill="#ea4335" d="M14.5 4h-5L8 6H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-3l-1.5-2zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"></path>
          </svg>
        </span>
        <!-- AI Mode Pill -->
        <button class="ai-mode-btn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" class="sparkle-icon">
            <path fill="#3c4043" d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"></path>
          </svg>
          <span>AI Mode</span>
        </button>
      </div>
    </div>

    <!-- Search Buttons -->
    <div class="search-buttons">
      <button type="button">Google Search</button>
      <button type="button">I'm Feeling Lucky</button>
    </div>

    <!-- Gemini Promo Banner -->
    <div class="promo-banner">
      <svg class="gemini-star" viewBox="0 0 24 24" width="20" height="20">
        <defs>
          <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4285F4" />
            <stop offset="40%" stop-color="#9B72CB" />
            <stop offset="70%" stop-color="#D96570" />
            <stop offset="100%" stop-color="#F2A654" />
          </linearGradient>
        </defs>
        <path fill="url(#geminiGrad)" d="M12 2c.5 4.5 4.5 8.5 9 9-4.5.5-8.5 4.5-9 9-.5-4.5-4.5-8.5-9-9 4.5-.5 8.5-4.5 9-9z"></path>
      </svg>
      <a href="#" class="promo-text">Google Gemini now has Gemini 4 Argon - our new frontier model for your toughest tasks</a>
    </div>

    <!-- Language Offering -->
    <div class="languages">
      Google offered in:
      <a href="#">हिन्दी</a>
      <a href="#">বাংলা</a>
      <a href="#">తెలుగు</a>
      <a href="#">मराठी</a>
      <a href="#">தமிழ்</a>
      <a href="#">ગુજરાતી</a>
      <a href="#">ಕನ್ನಡ</a>
      <a href="#">മലയാളം</a>
      <a href="#">ਪੰਜਾਬੀ</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-top">
      <span>India</span>
    </div>
    <div class="footer-bottom">
      <div class="footer-left">
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </div>
      <div class="footer-right">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </div>
  </footer>

</body>
</html>
